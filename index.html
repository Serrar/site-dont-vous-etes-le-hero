<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gamebook</title>
  </head>
  <body>
    <main>
      <!-- MENU PRINCIPAL : le choix d'aventure, puis (bien séparé) l'accès à l'atelier -->
      <section id="menu" data-testid="menu">
        <h1>Choisis ton aventure</h1>
        <div id="campaign-list" data-testid="campaign-list"></div>

        <h2 id="drafts-title" class="menu-subtitle" hidden>Mes aventures</h2>
        <div id="draft-list" data-testid="draft-list"></div>

        <div class="divider" aria-hidden="true"><span>❦</span></div>

        <section id="workshop" class="workshop" data-testid="workshop" aria-labelledby="workshop-title">
          <h2 id="workshop-title">L'atelier du scribe</h2>
          <p>Invente tes propres aventures, modifie-les et teste-les.</p>
          <button id="open-editor" data-testid="open-editor">✒ Créer ou modifier une aventure</button>
        </section>
      </section>

      <section id="game" hidden>
        <button id="back" data-testid="back-to-menu">← Changer d'aventure</button>
        <h1 id="title" data-testid="campaign-title"></h1>
        <figure id="illustration" data-testid="illustration" aria-hidden="true" hidden></figure>
        <div id="sheet" data-testid="sheet"></div>
        <p id="scene-text" data-testid="scene-text"></p>
        <p id="roll" data-testid="roll"></p>
        <div id="choices"></div>
        <h2 id="ending" data-testid="ending" hidden></h2>
        <button id="restart" data-testid="restart" hidden>Rejouer</button>
      </section>

      <!-- ATELIER : construit par src/editor/editor.ts -->
      <section id="editor" data-testid="editor" hidden></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
