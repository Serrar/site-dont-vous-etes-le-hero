<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Galerie des illustrations</title>
    <style>
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
      figure { margin: 0; }
      figcaption { text-align: center; font-size: 0.85rem; margin-top: 0.3rem; color: #e6c77a; }
      main { max-width: 1000px !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Galerie des illustrations</h1>
      <div id="grid" data-testid="gallery"></div>
    </main>
    <script type="module">
      import "/src/style.css";
      import { illustrations } from "/src/illustrations/index.ts";
      const grid = document.getElementById("grid");
      for (const [id, svg] of Object.entries(illustrations)) {
        const fig = document.createElement("figure");
        fig.innerHTML = `<div class="frame">${svg}</div><figcaption>${id}</figcaption>`;
        grid.append(fig);
      }
    </script>
    <style>
      .frame { padding: 5px; border-radius: 7px 12px 8px 13px / 12px 7px 13px 8px; background: linear-gradient(135deg, var(--paper-light), var(--paper-dark)); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
      .frame svg { display: block; width: 100%; height: auto; aspect-ratio: 2/1; background: radial-gradient(ellipse at center, #f1e4bf 40%, #dcc48c 100%); border-radius: 4px; }
    </style>
  </body>
</html>
